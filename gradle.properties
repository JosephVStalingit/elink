org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.caching.debug=false
#org.gradle.configureondemand=true
#org.gradle.configuration-cache=true

# Gradle needs a Java 21+ build JVM (it is the JVM running Gradle) and a Java 17 toolchain to compile
# Minecraft 1.20.x. Toolchain auto-detection alone does not always find locally installed JDKs, so
# the paths are listed explicitly here. Adjust or delete this line if your JDKs live elsewhere.
org.gradle.java.installations.paths=C:\\Program Files\\Microsoft\\jdk-17.0.20.8-hotspot,C:\\Users\\JosephVStalin\\.jdks\\temurin-21

mod.id=mcp2p
mod.name=MC P2P
mod.version=0.1.0-SNAPSHOT
mod.group=com.example
mod.description=Peer-to-peer LAN connectivity for Minecraft, powered by WebRTC data channels and MQTT signalling.

# P2P runtime libraries. These are independent of the Minecraft version, so they live here instead of
# in versions/dependencies/<minecraft>.properties. They are nested into the mod jar with Loom's
# `include` (jar-in-jar); see docs/dependency-bundling.md for why that is the only viable route.
webrtc.java.version=0.18.0
# Native build shipped for the WebRTC library. Available classifiers:
# windows-x86_64, windows-aarch64, linux-x86_64, linux-aarch64, linux-aarch32,
# macos-x86_64, macos-aarch64.
webrtc.natives.classifier=windows-x86_64
paho.version=1.2.5
